name: CI/CD for ASR-Terminal

on:
  push:
    branches:
      - main

concurrency:
  group: ASR-Terminal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -Eeuo pipefail

            DIR="/home/ubuntu/ASR-Terminal"
            cd "$DIR"

            echo "Starting deployment..."

            PREVIOUS_COMMIT="$(git rev-parse HEAD)"

            rollback() {
              echo "Deployment failed. Rolling back to $PREVIOUS_COMMIT"
              trap - ERR

              git reset --hard "$PREVIOUS_COMMIT"

              npm ci --prefer-offline
              npm run build

              pm2 restart asrterminal --update-env

              echo "Rollback completed."
            }

            trap 'rollback' ERR

            echo "Fetching latest code..."
            git fetch origin main

            echo "Deploying latest code..."
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci --prefer-offline

            echo "Building application..."
            npm run build

            echo "Restarting application..."
            pm2 restart asrterminal --update-env

            echo "Waiting for application to start..."
            sleep 5

            echo "Running health check..."

            for i in {1..3}; do
              if curl --fail --silent --show-error \
                --max-time 5 http://127.0.0.1:4006; then

                echo "Health check passed!"
                trap - ERR
                exit 0
              fi

              echo "Health check attempt $i failed."

              if [ "$i" -lt 3 ]; then
                echo "Retrying in 5 seconds..."
                sleep 5
              fi
            done

            echo "Health check failed after 3 attempts."
            exit 1